# Loco configuration for development

# Application settings
settings:
  jwt_secret: your-secret-key-here

# Server settings
server:
  port: 5150
  host: 0.0.0.0
  middlewares:
    static:
      enable: true
      must_exist: true
      folder:
        uri: /static
        path: assets/static
    cors:
      enable: true
      allow_origins:
        - "*"
      allow_headers:
        - "*"
      allow_methods:
        - "*"

# Database settings
database:
  uri: "sqlite://./nahwu_shorof.db?mode=rwc"
  enable_logging: true
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true

# Logger settings
logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact
