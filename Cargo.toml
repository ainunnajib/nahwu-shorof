[package]
name = "nahwu-shorof"
version = "0.1.0"
edition = "2021"
description = "Arabic Grammar Learning Platform - Nahwu & Shorof"
authors = ["Ainun Najib"]

[dependencies]
loco-rs = "0.14"
migration = { path = "migration" }

tokio = { version = "1.42", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.19", features = ["derive"] }
sea-orm = { version = "1.1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
] }
tera = "1.20"
include_dir = "0.7"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rand = "0.8"

[workspace]
members = ["migration"]

[[bin]]
name = "nahwu_shorof_cli"
path = "src/bin/main.rs"

[dev-dependencies]
serial_test = "3"
rstest = "0.23"
insta = { version = "1.41", features = ["redactions", "yaml", "filters"] }
